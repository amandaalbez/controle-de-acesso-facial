<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Login - Controle de Acesso Facial</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <div class="container">
    <h2>Login</h2>

    <form id="loginForm">
      <input id="loginInput" placeholder="Usuário ou email" required />
      <input id="passwordInput" type="password" placeholder="Senha" required />
      <div class="row">
        <button id="btnLogin" type="submit">Entrar</button>
        <button id="btnToRegister" type="button" class="btn-secondary">Cadastrar</button>
      </div>
    </form>

    <div id="status" class="msg">Verificando API...</div>
  </div>

  <script src="login.js"></script>
</body>
</html>
