<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Login – APS Biometria</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: linear-gradient(135deg, #f0f8f0 0%, #e8f5e8 100%);
      color: #2d4a3d; 
      line-height: 1.6; 
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .title-bar {
      background: linear-gradient(135deg, #7fb069 0%, #a8d8a8 100%);
      color: white;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      box-shadow: 0 2px 10px rgba(127,176,105,0.2);
      -webkit-app-region: drag;
    }
    
    .title-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .status {
      font-size: 0.85em;
      opacity: 0.9;
    }
    
    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    
    .login-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.1);
      padding: 24px;
      width: 100%;
      max-width: 340px;
      border: 1px solid #e8f5e8;
    }
    
    .logo-section {
      text-align: center;
      margin-bottom: 24px;
    }
    
    .logo-icon {
      font-size: 2.5em;
      margin-bottom: 8px;
      display: block;
    }
    
    .logo-section h1 {
      color: #2d4a3d;
      font-size: 1.4em;
      margin-bottom: 6px;
      font-weight: 600;
    }
    
    .logo-section p {
      color: #6b8e6b;
      font-size: 0.8em;
    }
    
    .login-form {
      margin-bottom: 20px;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-group label {
      display: block;
      color: #2d4a3d;
      font-weight: 500;
      margin-bottom: 6px;
      font-size: 0.85em;
    }
    
    .form-input {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e8f5e8;
      border-radius: 6px;
      font-size: 0.9em;
      transition: all 0.3s;
      background: #fafcfa;
    }
    
    .form-input:focus {
      outline: none;
      border-color: #7fb069;
      background: white;
      box-shadow: 0 0 0 3px rgba(127,176,105,0.1);
    }
    
    .form-input::placeholder {
      color: #a8c4a8;
    }
    
    .login-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #7fb069 0%, #a8d8a8 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.9em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 12px;
    }
    
    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(127,176,105,0.3);
    }
    
    .login-btn:active {
      transform: translateY(0);
    }
    
    .divider {
      text-align: center;
      margin: 16px 0;
      position: relative;
      color: #6b8e6b;
      font-size: 0.8em;
    }
    
    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #e8f5e8;
      z-index: 1;
    }
    
    .divider span {
      background: white;
      padding: 0 16px;
      position: relative;
      z-index: 2;
    }
    
    .register-link {
      text-align: center;
      color: #6b8e6b;
      font-size: 0.8em;
    }
    
    .register-link a {
      color: #7fb069;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
    }
    
    .register-link a:hover {
      color: #5a8c4a;
      text-decoration: underline;
    }
    
    .back-link {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #7fb069;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      font-size: 0.85em;
      transition: all 0.3s;
      background: white;
      padding: 6px 10px;
      border-radius: 5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    
    .back-link:hover {
      color: #5a8c4a;
      transform: translateX(-2px);
    }
    
    .loading {
      display: none;
      text-align: center;
      color: #6b8e6b;
      font-size: 0.8em;
      margin-top: 12px;
    }
    
    .loading.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="title-bar">
    <div class="title-info">
      <span>🔐</span>
      <span>Ministério do Meio Ambiente - Sistema de Login</span>
    </div>
    <div class="status" id="status">Pronto para autenticação</div>
  </div>

  <!--<a href="level1.html" class="back-link">
    <span>←</span>
    <span>Voltar</span>
  </a>
  -->
  
  <div class="login-container">
    <div class="login-card">
      <div class="logo-section">
        <span class="logo-icon">🌿</span>
        <h1>Login</h1>
        <p>Ministério do Meio Ambiente</p>
      </div>

      <form class="login-form">
        <div class="form-group">
          <label for="loginEmail">Email ou Nome de Usuário</label>
          <input 
            id="loginEmail" 
            class="form-input"
            type="text"
            placeholder="Digite seu email ou nome de usuário"
            required
          />
        </div>

        <div class="form-group">
          <label for="loginPassword">Senha</label>
          <input 
            id="loginPassword" 
            class="form-input"
            type="password" 
            placeholder="Digite sua senha"
            required
          />
        </div>

        <button type="submit" class="login-btn" id="btnLogin">
          Entrar no Sistema
        </button>
      </form>

      <div class="loading" id="loading">
        🔄 Verificando credenciais...
      </div>

      <div class="divider">
        <span>ou</span>
      </div>

      <div class="register-link">
        <p>Não possui uma conta? <a href="register.html">Cadastre-se aqui</a></p>
      </div>
    </div>
  </div>

  <script src="./login.js"></script>
</body>
</html>
