<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>EcoFace - Ministerio do meio ambiente de São Paulo | Login</title>
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body class="auth">
  <div class="container auth-card">
    <div class="app-brand">
      <div class="app-brand__badge app-brand__badge--round">Eco</div>
      <div class="app-brand__title">EcoFace - Ministerio do meio ambiente de São Paulo</div>
      <div class="app-brand__subtitle">Acesso ao painel</div>
    </div>
    <h2>Login</h2>

    <form id="loginForm">
      <label for="loginInput">Usuário ou email</label>
      <input id="loginInput" type="text" name="username" placeholder="Usuário ou email" autocomplete="username" required autofocus />
      <label for="passwordInput">Senha</label>
      <input id="passwordInput" type="password" name="password" placeholder="Senha" autocomplete="current-password" required />
      <div class="row">
        <button id="btnLogin" type="submit">Entrar</button>
        <button id="btnToRegister" type="button" class="btn-secondary">Cadastrar</button>
      </div>
    </form>

    <div id="status" class="msg" role="status" aria-live="polite">Verificando API...</div>
  </div>

  <script src="login.js"></script>
</body>
</html>
