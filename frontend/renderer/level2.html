<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Nível 2 – Dashboard Diretores</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #eef3f9; }
    header { background: #1565c0; color: white; padding: 15px; text-align: center; }
    main { padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    .card h3 { margin-top: 0; color: #1565c0; }
  </style>
</head>
<body>
  <header>
    <h1>🔒 Dashboard – Diretores</h1>
  </header>

  <main>
    <div class="card">
      <h3>Áreas Críticas de Desmatamento</h3>
      <p>Mato Grosso, Pará e Rondônia concentram 70% dos focos recentes.</p>
    </div>
    <div class="card">
      <h3>Consumo Energético por Setor</h3>
      <p>Transporte 32% | Indústria 28% | Residencial 15%</p>
    </div>
    <div class="card">
      <h3>Reservatórios em Risco</h3>
      <p>12 regiões monitoradas apresentam níveis de contaminação preocupantes.</p>
    </div>
  </main>
</body>
</html>
